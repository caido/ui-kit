name: Validate

on:
  pull_request:
    types:
      - review_requested

  push:
    branches:
      - 'main'

concurrency:
  group: validate-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: 'Typecheck'
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: caido/action-mise-action@v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise pnpm:install --frozen-lockfile

      - name: Run typechecker
        run: mise typecheck

  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: caido/action-mise-action@v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise pnpm:install --frozen-lockfile

      - name: Run linter
        run: mise lint:prod

  tokens:
    name: 'Tokens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: caido/action-mise-action@v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Install dependencies
        run: mise pnpm:install --frozen-lockfile

      - name: Run tests
        run: mise tokens:test

      - name: Check generated tokens are current
        run: mise tokens:check

      - name: Check colour pairings meet the contrast floor
        run: mise tokens:contrast

      - name: Check the published package contents
        run: mise tokens:build
