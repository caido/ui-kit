name: Links

on:
  schedule:
    - cron: "0 8 * * 1"

  push:
    paths:
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: links-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: 'Check links'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mise
        uses: caido/action-mise-action@v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}

      - name: Check links
        run: mise lint:links
        env:
          GITHUB_TOKEN: ${{ secrets.LYCHEE_GITHUB_TOKEN }}
